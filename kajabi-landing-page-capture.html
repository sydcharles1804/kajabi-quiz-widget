<!--
  ═══════════════════════════════════════════════════════════════════
  Kajabi LANDING PAGE (/sgd) — email capture fallback
  ═══════════════════════════════════════════════════════════════════

  Paste into a Custom Code block on the landing page that holds the
  opt-in form.

  WHY THIS EXISTS
  The quiz needs the visitor's email, and Kajabi is supposed to supply
  it by appending ?email= when it redirects to the thank-you page.
  In practice that parameter arrives empty in a real browser: Kajabi's
  /forms/<id>/thank_you endpoint only forwards a query string, it never
  injects one, and something in the Turbolinks submit path loses it
  before then. Server-side tests showed the parameter present at every
  hop, so this is not reproducible outside a browser.

  Rather than depend on that chain, this stashes the address in
  localStorage. The thank-you page reads it back when ?email= is
  missing (see kajabi-thank-you-page-embed.html). Both pages are on
  capturegreatness.org, so same-origin storage applies.

  WHY IT CAPTURES ON TYPING, NOT ON SUBMIT
  An earlier version hooked the form's submit event and never fired:
  Kajabi intercepts submission with its own JavaScript (Parsley
  validation plus a Turbolinks AJAX post), so a native submit event
  is not guaranteed to reach a listener added here. Reading the field
  as it is typed removes that dependency entirely — by the time the
  visitor can click Submit, the value is already stored. The submit
  and click handlers below are kept only as belt-and-braces.

  VERIFY IT IS WORKING
  On /sgd, type an address into the form, then open the browser
  console and run:  localStorage.getItem('cg_quiz_email')
  It should print the address you typed.
-->

<script>
(function () {
  var EMAIL_KEY = 'cg_quiz_email';
  var NAME_KEY  = 'cg_quiz_name';
  var TIME_KEY  = 'cg_quiz_captured_at';

  var EMAIL_SEL = 'input[name="form_submission[email]"]';
  var NAME_SEL  = 'input[name="form_submission[name]"]';

  function save(key, value) {
    try {
      if (value && value.trim()) {
        localStorage.setItem(key, value.trim());
        localStorage.setItem(TIME_KEY, String(Date.now()));
      }
    } catch (e) {
      /* private browsing or storage disabled — the quiz still runs,
         it just won't be able to deliver a report */
    }
  }

  // Capture as the visitor types. Delegated on document in the capture
  // phase so it works no matter when Kajabi renders the form block, and
  // regardless of any handler that stops propagation further down.
  function onInput(e) {
    var el = e.target;
    if (!el || !el.name) return;
    if (el.name === 'form_submission[email]') save(EMAIL_KEY, el.value);
    else if (el.name === 'form_submission[name]') save(NAME_KEY, el.value);
  }

  document.addEventListener('input',  onInput, true);
  document.addEventListener('change', onInput, true);

  // Belt and braces: also sweep the fields on any submit or button
  // click, in case a password manager or autofill populated them
  // without firing input events.
  function sweep() {
    var email = document.querySelector(EMAIL_SEL);
    var name  = document.querySelector(NAME_SEL);
    if (email) save(EMAIL_KEY, email.value);
    if (name)  save(NAME_KEY,  name.value);
  }

  document.addEventListener('submit', sweep, true);
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.type === 'submit' || (t.closest && t.closest('[type="submit"]'))) sweep();
  }, true);
})();
</script>
