<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholarship Readiness Quiz</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f4f6fb;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── Widget shell ─────────────────────────────────────── */
    .widget {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.09);
      width: 100%;
      max-width: 580px;
      overflow: hidden;
    }

    /* ── Progress header ──────────────────────────────────── */
    .progress-header {
      padding: 22px 28px 0;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #9aa3b2;
      margin-bottom: 8px;
    }

    .progress-track {
      height: 5px;
      background: #eef0f5;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3a6fdf, #6a9fff);
      border-radius: 3px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
      will-change: width;
    }

    /* ── Question body ────────────────────────────────────── */
    .question-body {
      padding: 26px 28px 28px;
    }

    .section-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #3a6fdf;
      background: #eef2ff;
      border-radius: 20px;
      padding: 4px 10px;
      margin-bottom: 14px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 700;
      color: #12192e;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    /* ── Options ──────────────────────────────────────────── */
    .options {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 24px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      border: 2px solid #e4e8f0;
      border-radius: 11px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      user-select: none;
    }

    .option:hover {
      border-color: #3a6fdf;
      background: #f0f4ff;
      transform: translateX(2px);
    }

    .option.selected {
      border-color: #3a6fdf;
      background: #eef2ff;
    }

    .option-letter {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #eef0f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: #7a85a0;
      transition: background 0.15s, color 0.15s;
    }

    .option.selected .option-letter {
      background: #3a6fdf;
      color: #fff;
    }

    .option-text {
      font-size: 14px;
      color: #2c3550;
      line-height: 1.4;
    }

    /* ── Primary button ───────────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #3a6fdf;
      color: #fff;
      border: none;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }

    .btn-primary:hover:not(:disabled) {
      background: #2a5bc9;
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      background: #c0cef0;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Result screen ────────────────────────────────────── */
    .result-top {
      padding: 32px 28px 0;
      text-align: center;
    }

    .result-emoji { font-size: 52px; line-height: 1; margin-bottom: 10px; }

    .result-category {
      font-size: 20px;
      font-weight: 800;
      color: #12192e;
      margin-bottom: 5px;
    }

    .result-score-line {
      font-size: 13px;
      color: #9aa3b2;
      margin-bottom: 22px;
    }

    .result-card {
      margin: 0 28px;
      background: #f7f9fc;
      border-radius: 13px;
      padding: 20px;
      text-align: left;
    }

    .result-card p {
      font-size: 14px;
      color: #3c4561;
      line-height: 1.75;
      margin-bottom: 14px;
    }

    .result-card p:last-of-type { margin-bottom: 0; }

    .focus-heading {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #3a6fdf;
      margin-top: 16px;
      margin-bottom: 8px;
    }

    .focus-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .focus-list li {
      font-size: 13px;
      color: #3c4561;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .focus-list li::before {
      content: '→';
      color: #3a6fdf;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ── Contact form ─────────────────────────────────────── */
    .contact-section {
      padding: 24px 28px 28px;
    }

    .contact-heading {
      font-size: 17px;
      font-weight: 700;
      color: #12192e;
      margin-bottom: 4px;
    }

    .contact-sub {
      font-size: 13px;
      color: #9aa3b2;
      margin-bottom: 18px;
    }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #5a6480;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e4e8f0;
      border-radius: 9px;
      font-size: 14px;
      color: #12192e;
      outline: none;
      transition: border-color 0.15s;
      background: #fff;
    }

    .field input:focus { border-color: #3a6fdf; }

    .error-msg {
      font-size: 12px;
      color: #e53e3e;
      margin-top: 10px;
      display: none;
    }

    /* ── Thank-you screen ─────────────────────────────────── */
    .thankyou {
      padding: 56px 28px;
      text-align: center;
    }

    .thankyou-icon { font-size: 60px; margin-bottom: 16px; }

    .thankyou h2 {
      font-size: 22px;
      font-weight: 800;
      color: #12192e;
      margin-bottom: 10px;
    }

    .thankyou p {
      font-size: 14px;
      color: #6b7591;
      line-height: 1.7;
      max-width: 360px;
      margin: 0 auto;
    }

    /* ── Utility ──────────────────────────────────────────── */
    .hidden { display: none !important; }

    .divider {
      height: 1px;
      background: #eef0f5;
      margin: 0 28px;
    }

    /* ── Mobile ───────────────────────────────────────────── */
    @media (max-width: 520px) {
      body { padding: 0; background: #fff; }
      .widget { border-radius: 0; box-shadow: none; min-height: 100vh; }
    }
  </style>
</head>
<body>
<div class="widget" id="widget">

  <!-- ════════════════════════════════════════════════
       SCREEN A — Questions
  ════════════════════════════════════════════════ -->
  <div id="screen-q">

</div><!-- /.widget -->

// ═══════════════════════════════════════════════════════════
//  Quiz state
// ═══════════════════════════════════════════════════════════
let currentIndex  = 0;
let selectedValue = null;
let grade         = null;
let totalScore    = 0;
let allAnswers    = {};

// ── Kick off ─────────────────────────────────────────────
renderQuestion();

// ═══════════════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════════════
function getTier(score) {
  if (score <= 24) return 'low';
  if (score <= 42) return 'mid';
  return 'high';
}

function getResult() {
  return RESULTS[grade][getTier(totalScore)];
}

// ═══════════════════════════════════════════════════════════
//  Render a question
// ═══════════════════════════════════════════════════════════
function renderQuestion() {
  const q     = QUESTIONS[currentIndex];
  const total = QUESTIONS.length;
  const pct   = Math.round((currentIndex / total) * 100);
  const letters = ['A', 'B', 'C', 'D', 'E'];

  // Progress
  document.getElementById('prog-label').textContent = `Question ${currentIndex + 1} of ${total}`;
  document.getElementById('prog-pct').textContent   = `${pct}%`;
  document.getElementById('prog-fill').style.width  = `${pct}%`;

  // Question text
  document.getElementById('q-section').textContent = q.section;
  document.getElementById('q-text').textContent    = q.text;

  // Button label
  const isLast = currentIndex === QUESTIONS.length - 1;
  document.getElementById('btn-next').textContent = isLast ? 'See My Results →' : 'Next →';
  document.getElementById('btn-next').disabled    = true;

  // Options
  const container = document.getElementById('q-options');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `
      <div class="option-letter">${letters[i]}</div>
      <div class="option-text">${opt.label}</div>
    `;
    div.addEventListener('click', () => selectOption(div, opt.value));
    container.appendChild(div);
  });

  selectedValue = null;
}

// ═══════════════════════════════════════════════════════════
//  Handle option selection
// ═══════════════════════════════════════════════════════════
function selectOption(el, value) {
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedValue = value;
  document.getElementById('btn-next').disabled = false;
}

// ═══════════════════════════════════════════════════════════
//  Advance to next question
// ═══════════════════════════════════════════════════════════
function nextQuestion() {
  if (selectedValue === null) return;

  const q = QUESTIONS[currentIndex];

  // Store answer
  allAnswers[q.id] = selectedValue;

  if (q.isGrade) {
    grade = selectedValue;
  } else if (q.scored) {
    totalScore += Number(selectedValue);
  }

  currentIndex++;

  if (currentIndex >= QUESTIONS.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

// ═══════════════════════════════════════════════════════════
//  Show result screen
// ═══════════════════════════════════════════════════════════
function showResult() {
  document.getElementById('screen-q').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');

  const result = getResult();
  const tier   = getTier(totalScore);

  // Badge / category / score line
  document.getElementById('r-emoji').textContent    = result.emoji;
  document.getElementById('r-category').textContent = result.label;

  const rangeMap = { low: '12–24', mid: '25–42', high: '43–60' };
  document.getElementById('r-scoreline').textContent =
    `Score: ${totalScore} / 60  ·  Range: ${rangeMap[tier]}  ·  Grade: ${grade}`;

  // Message card
  const card = document.getElementById('r-card');
  const paras = result.paragraphs.map(p => `<p>${p}</p>`).join('');
  const items = result.focus.map(f => `<li>${f}</li>`).join('');
  card.innerHTML = `
    ${paras}
    <div class="focus-heading">👉 Focus Areas</div>
    <ul class="focus-list">${items}</ul>
  `;
}

// ═══════════════════════════════════════════════════════════
//  Submit to Supabase
// ═══════════════════════════════════════════════════════════
async function submitResult() {
  const name  = document.getElementById('inp-name').value.trim();
  const email = document.getElementById('inp-email').value.trim();
  const errEl = document.getElementById('form-error');

  if (!name || !email || !email.includes('@')) {
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const btn = document.getElementById('btn-submit');
  btn.disabled    = true;
  btn.textContent = 'Saving…';

  const result = getResult();

  const { error } = await db.from('quiz_submissions').insert({
    name,
    email,
    grade,
    total_score:      totalScore,
    result_category:  getTier(totalScore),          // 'low' | 'mid' | 'high'
    result_label:     result.label,                 // human-readable
    q13_answer:       allAnswers['q13'] ?? null,     // reflection only
    answers:          allAnswers                     // full answer map
  });

  if (error) {
    console.error('Supabase error:', error);
    btn.disabled    = false;
    btn.textContent = 'Get My Action Plan →';
    errEl.textContent = 'Something went wrong. Please try again.';
    errEl.style.display = 'block';
    return;
  }

  // Success — show thank-you
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-ty').classList.remove('hidden');
}
</script>
