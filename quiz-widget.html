<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholarship Readiness Assessment</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- Credentials live in config.js, which is gitignored.
       Copy config.example.js to config.js to set it up. -->
  <script src="./config.js"></script>
  <!-- The same pairing capturegreatness.org uses -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Quattrocento+Sans:wght@400;700&display=swap" />
  <style>
    /* ── Local face for numerals ─────────────────────────────────── */
    @font-face {
      font-family: 'IBMPlexMono';
      src: url('./fonts/IBMPlexMono-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'IBMPlexMono';
      src: url('./fonts/IBMPlexMono-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    /* ── Design tokens ───────────────────────────────────────────────
       Palette taken from capturegreatness.org and Brand Assets/:
       deep blue and teal section bands, gold used to highlight key
       phrases on dark, berry as the secondary accent, warm cream as
       the one non-white surface.                                     */
    :root {
      --ink:    #135875;
      --navy:   #2A5265;
      --teal:   #18919F;
      --berry:  #9B3157;
      --gold:   #F1C40F;
      --cream:  #F0EAD4;
      --mist:   #CAD5DB;
      --paper:  #FFFFFF;
      --body:   #44585F;
      --muted:  #6E828B;

      --line:      #DFE7EA;
      --line-soft: #EDF2F4;
      --tint:      #F7FAFB;

      --serif: 'PT Serif', Georgia, 'Times New Roman', serif;
      --sans:  'Quattrocento Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono:  'IBMPlexMono', ui-monospace, SFMono-Regular, Menlo, monospace;

      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --shadow: 0 1px 2px rgba(19, 88, 117, 0.05);

      /* Readable column width. The shell itself goes edge-to-edge to
         fill whatever it's embedded in; this keeps text and controls
         from stretching the full width of a wide page. */
      --content-max: 640px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: transparent;
      padding: 0;
      color: var(--body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ── Shell ───────────────────────────────────────────────────────
       Full-bleed by design: fills whatever iframe it's embedded in,
       so no max-width and no border-radius. A hairline border and a
       near-invisible shadow are kept to give it a faint edge against
       the page it's embedded in, without reading as a floating card. */
    .widget {
      background: var(--paper);
      width: 100%;
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    /* ── Progress rail, flush to the top edge ────────────────────── */
    .prog-track {
      height: 3px;
      background: var(--line-soft);
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      background: var(--teal);
      transition: width 0.5s var(--ease);
      will-change: width;
    }

    .prog-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 22px;
    }

    .prog-counter,
    .prog-pct {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .prog-counter { color: var(--teal); font-weight: 700; }

    /* ── Question body ───────────────────────────────────────────── */
    .q-body {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 26px 30px 30px;
    }

    .q-body.anim-in { animation: qIn 0.4s var(--ease) both; }

    @keyframes qIn {
      from { opacity: 0; transform: translateX(14px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .section-label {
      font-family: var(--sans);
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--teal);
      margin-bottom: 12px;
    }

    .q-text {
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.32;
      letter-spacing: -0.005em;
      text-wrap: balance;
      margin-bottom: 26px;
    }

    /* ── Options — rows separated by rules, not boxed cards ──────── */
    .options {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--line-soft);
      margin-bottom: 26px;
    }

    @keyframes optIn {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: left;
      padding: 15px 14px 15px 12px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      font: inherit;
      color: inherit;
      cursor: pointer;
      opacity: 0;
      animation: optIn 0.32s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 55ms + 60ms);
      transition: background-color 0.2s var(--ease), transform 0.2s var(--ease);
    }

    /* Selection bar, drawn from the left edge */
    .option::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--teal);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 0.25s var(--ease);
    }

    .option:hover {
      background: var(--tint);
      transform: translateX(2px);
    }

    .option.selected {
      background: var(--cream);
      transform: translateX(2px);
    }

    .option.selected::before { transform: scaleY(1); }

    .opt-letter {
      flex-shrink: 0;
      width: 27px;
      height: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      background: var(--line-soft);
      border-radius: 7px;
      transition: background-color 0.2s var(--ease), color 0.2s var(--ease);
    }

    .option:hover .opt-letter { background: var(--mist); color: var(--ink); }

    .option.selected .opt-letter {
      background: var(--teal);
      color: var(--paper);
    }

    .opt-text {
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--body);
    }

    .option.selected .opt-text { color: var(--ink); }

    /* ── Primary action ──────────────────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 15px 18px;
      background: var(--ink);
      color: var(--paper);
      border: 0;
      border-radius: 9px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: background-color 0.2s var(--ease),
                  transform 0.12s var(--ease),
                  box-shadow 0.2s var(--ease);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--navy);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px -12px rgba(19, 88, 117, 0.7);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn-primary:disabled {
      background: var(--line);
      color: #9AAAB2;
      cursor: not-allowed;
    }

    /* ── Result — dark band, echoing the site's section bands ──────
       The navy background fills the full width; .band-row is the
       centered, width-capped content that sits on top of it. ────── */
    .result-band {
      background: var(--navy);
      padding: 26px 30px;
    }

    .band-row {
      max-width: var(--content-max);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .score-block { display: flex; align-items: baseline; gap: 7px; }

    .score-num {
      font-family: var(--mono);
      font-size: 46px;
      font-weight: 700;
      color: var(--paper);
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .score-of {
      font-family: var(--mono);
      font-size: 15px;
      color: #8FB3C1;
    }

    .tier-block { text-align: right; }

    /* Gold on dark is the site's own emphasis pattern */
    .tier-badge {
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .tier-low  { color: #F0A3A3; }
    .tier-mid  { color: var(--gold); }
    .tier-high { color: #7FD4C1; }

    .score-caption {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.06em;
      color: #8FB3C1;
    }

    .result-body {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 30px 30px 8px;
    }

    .result-heading {
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
      letter-spacing: -0.005em;
      text-wrap: balance;
      margin-bottom: 18px;
    }

    .result-card p {
      font-size: 15px;
      line-height: 1.75;
      color: var(--body);
      margin-bottom: 14px;
      max-width: 62ch;
    }

    .result-card p:last-of-type { margin-bottom: 0; }

    /* ── Closing notice ──────────────────────────────────────────── */
    .notice {
      /* Same 30px gutter as .q-body/.result-body, expressed as a width
         calc since this box is margin- rather than padding-inset. */
      width: calc(100% - 60px);
      max-width: var(--content-max);
      margin: 26px auto 30px;
      padding: 18px 20px;
      background: var(--cream);
      border-radius: 10px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .notice svg {
      flex-shrink: 0;
      width: 19px;
      height: 19px;
      margin-top: 1px;
      color: var(--berry);
    }

    .email-notice {
      font-family: var(--sans);
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--ink);
    }

    /* ── Utility ─────────────────────────────────────────────────── */
    .hidden { display: none !important; }

    :focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ── Mobile ──────────────────────────────────────────────────── */
    @media (max-width: 520px) {
      .q-body      { padding: 22px 20px 26px; }
      .result-band { padding: 22px 20px; }
      .result-body { padding: 24px 20px 6px; }
      .notice      { width: calc(100% - 40px); margin: 22px auto 26px; }
      .q-text, .result-heading { font-size: 21px; }
      .score-num   { font-size: 38px; }
      .tier-block  { text-align: left; }
    }

    /* ── Respect reduced-motion preferences ──────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .option { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="widget" id="widget">

  <!-- ══════════════════════════════════════
       SCREEN A — Questions
  ══════════════════════════════════════ -->
  <main id="screen-q">
    <div class="prog-track">
      <div class="prog-fill" id="prog-fill" style="width:0%"></div>
    </div>

    <div class="q-body" id="q-body">
      <div class="prog-meta">
        <span class="prog-counter" id="prog-label">01 / 14</span>
        <span class="prog-pct"     id="prog-pct">0%</span>
      </div>

      <p class="section-label" id="q-section"></p>
      <h1 class="q-text"       id="q-text"></h1>

      <div class="options" id="q-options" role="radiogroup" aria-labelledby="q-text"></div>

      <button class="btn-primary" id="btn-next" disabled onclick="nextQuestion()">
        Continue
      </button>
    </div>
  </main>

  <!-- ══════════════════════════════════════
       SCREEN B — Result
  ══════════════════════════════════════ -->
  <main id="screen-result" class="hidden">

    <div class="result-band">
      <div class="band-row">
        <div class="score-block">
          <span class="score-num" id="r-score-num">0</span>
          <span class="score-of">/ 60</span>
        </div>
        <div class="tier-block">
          <p class="tier-badge"    id="r-tier"></p>
          <p class="score-caption" id="r-score-cap"></p>
        </div>
      </div>
    </div>

    <div class="result-body">
      <h1 class="result-heading" id="r-category"></h1>
      <div class="result-card"   id="r-card"></div>
    </div>

    <div class="notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
        <path d="m2 7 10 6 10-6"></path>
      </svg>
      <p class="email-notice" id="email-notice"></p>
    </div>
  </main>

</div><!-- /.widget -->

<script>
// ═══════════════════════════════════════════════════════════════
//  Supabase client
// ═══════════════════════════════════════════════════════════════
// Credentials come from config.js (untracked). Missing config must not
// break the quiz itself — the parent still gets their on-screen result;
// only the emailed report is lost, and that is logged for debugging.
const CONFIG = window.QUIZ_CONFIG || {};

if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY) {
  console.error(
    'Quiz config missing. Copy config.example.js to config.js and fill in ' +
    'your Supabase URL and publishable key. The quiz will run, but results ' +
    'will not be saved or emailed.'
  );
}

const db = (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY)
  ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY)
  : null;

// ═══════════════════════════════════════════════════════════════
//  Contact identity — passed in via URL from the Kajabi landing page
// ═══════════════════════════════════════════════════════════════
const urlParams    = new URLSearchParams(window.location.search);
const contactEmail = urlParams.get('email');
const contactName  = urlParams.get('name');

// ═══════════════════════════════════════════════════════════════
//  Auto-height: tell parent iframe our exact rendered height
// ═══════════════════════════════════════════════════════════════
function sendHeight() {
  const h = document.getElementById('widget').offsetHeight + 12;
  window.parent.postMessage({ type: 'quizHeight', height: h }, '*');
}

if (window.ResizeObserver) {
  new ResizeObserver(sendHeight).observe(document.getElementById('widget'));
}

let currentIndex  = 0;
let selectedValue = null;
let grade         = null;
let totalScore    = 0;
let allAnswers    = {};

// ── Kick off ────────────────────────────────────────────────────
renderQuestion();

// ═══════════════════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════════════════
function getTier(score) {
  if (score <= 24) return 'low';
  if (score <= 42) return 'mid';
  return 'high';
}

function getResult() {
  return RESULTS[grade][getTier(totalScore)];
}

// Count-up animation for the score reveal
function animateCount(el, target, duration) {
  const start = performance.now();
  (function tick(now) {
    const p    = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3); // cubic ease-out
    el.textContent = Math.round(ease * target);
    if (p < 1) requestAnimationFrame(tick);
  })(performance.now());
}

// ═══════════════════════════════════════════════════════════════
//  Render a question
// ═══════════════════════════════════════════════════════════════
function renderQuestion() {
  const q      = QUESTIONS[currentIndex];
  const total  = QUESTIONS.length;
  const pct    = Math.round((currentIndex / total) * 100);
  const padded = String(currentIndex + 1).padStart(2, '0');
  const letters = ['A', 'B', 'C', 'D', 'E'];

  // Progress
  document.getElementById('prog-label').textContent = `${padded} / ${String(total).padStart(2, '0')}`;
  document.getElementById('prog-pct').textContent   = `${pct}%`;
  document.getElementById('prog-fill').style.width  = `${pct}%`;

  // Section + question
  document.getElementById('q-section').textContent = q.section;
  document.getElementById('q-text').textContent    = q.text;

  // Button label
  const isLast = currentIndex === QUESTIONS.length - 1;
  const btn    = document.getElementById('btn-next');
  btn.textContent = isLast ? 'See My Results' : 'Continue';
  btn.disabled    = true;

  // Options — real buttons so they are keyboard-operable and focusable,
  // in a radiogroup so screen readers announce them as a single choice
  const container = document.getElementById('q-options');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btnEl = document.createElement('button');
    btnEl.type = 'button';
    btnEl.className = 'option';
    btnEl.setAttribute('role', 'radio');
    btnEl.setAttribute('aria-checked', 'false');
    btnEl.style.setProperty('--i', i);
    btnEl.innerHTML = `
      <span class="opt-letter" aria-hidden="true">${letters[i]}</span>
      <span class="opt-text">${opt.label}</span>
    `;
    btnEl.addEventListener('click', () => selectOption(btnEl, opt.value));
    container.appendChild(btnEl);
  });

  // Trigger slide-in animation
  const body = document.getElementById('q-body');
  body.classList.remove('anim-in');
  void body.offsetHeight; // force reflow
  body.classList.add('anim-in');

  selectedValue = null;
  requestAnimationFrame(sendHeight);
}

// ═══════════════════════════════════════════════════════════════
//  Select an option
// ═══════════════════════════════════════════════════════════════
function selectOption(el, value) {
  document.querySelectorAll('.option').forEach(o => {
    o.classList.remove('selected');
    o.setAttribute('aria-checked', 'false');
  });
  el.classList.add('selected');
  el.setAttribute('aria-checked', 'true');
  selectedValue = value;
  document.getElementById('btn-next').disabled = false;
}

// ═══════════════════════════════════════════════════════════════
//  Advance to next question
// ═══════════════════════════════════════════════════════════════
function nextQuestion() {
  if (selectedValue === null) return;

  const q = QUESTIONS[currentIndex];
  allAnswers[q.id] = selectedValue;

  if (q.isGrade) {
    grade = selectedValue;
  } else if (q.scored) {
    totalScore += Number(selectedValue);
  }

  currentIndex++;

  if (currentIndex >= QUESTIONS.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

// ═══════════════════════════════════════════════════════════════
//  Show result screen
// ═══════════════════════════════════════════════════════════════
function showResult() {
  document.getElementById('screen-q').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');

  const tier   = getTier(totalScore);
  const result = getResult();
  const rangeMap = { low: '12–24', mid: '25–42', high: '43–60' };

  // Tier badge (CSS color class — no emoji)
  const tierEl = document.getElementById('r-tier');
  tierEl.className    = `tier-badge tier-${tier}`;
  tierEl.textContent  = result.label;

  // Animated score count-up
  animateCount(document.getElementById('r-score-num'), totalScore, 900);

  // Score caption — the band already shows "/ 60", so no need to repeat it
  document.getElementById('r-score-cap').textContent =
    `range ${rangeMap[tier]}  ·  ${GRADE_LABELS[grade] || grade}`;

  // Category heading
  document.getElementById('r-category').textContent = result.heading;

  // Segment One — the immediate result, shown in full on screen
  document.getElementById('r-card').innerHTML = result.summary.map(p => `<p>${p}</p>`).join('');

  deliverReport(result);

  requestAnimationFrame(sendHeight);
}

// ═══════════════════════════════════════════════════════════════
//  Sales pages linked from the report's closing offer block.
//  A null URL falls back to SITE_URL so no report ever links to a 404.
// ═══════════════════════════════════════════════════════════════
const SITE_URL = 'https://www.capturegreatness.org';

const OFFER_URLS = {
  scholarsGetDollars: 'https://www.capturegreatness.org/scholars-get-dollars',
  // TODO: SCHOLAR Prep page not built yet. This is the offer in 6 of the 9
  // report variants (all of 9th–10th and 11th grade), so set it as soon as
  // the page exists — until then those reports fall back to the site root.
  scholarPrep: null
};

// Logo must be a public URL — email clients can't read local files.
// This is the same asset the Kajabi site header serves from their CDN.
const LOGO_URL = 'https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/file-uploads/themes/2159888204/settings_images/fa54718-861-d5d-d254-7480d10e0c6f_Capture-Greatness_Final_Logo_1_300-copy-2-1-2048x1024_1_.png';

// Capture Greatness brand palette (from Brand Assets/CG Color Palette.png)
const BRAND = {
  navy:  '#2A5265',
  teal:  '#18919F',
  berry: '#9B3157',
  ink:   '#2A5265',
  body:  '#44585F',
  muted: '#6E828B',
  panel: '#F1F6F8',
  line:  '#CAD5DB',
  paper: '#FFFFFF'
};

const GRADE_LABELS = {
  '7th-8th':  '7th–8th Grade',
  '9th-10th': '9th–10th Grade',
  '11th':     '11th Grade'
};

// ═══════════════════════════════════════════════════════════════
//  Full report — Segment One + Segment Two as email-ready HTML.
//  Styles must be inline: email clients strip <style> blocks and
//  external CSS, and web fonts don't load, so this uses a
//  web-safe stack rather than the widget's brand faces.
// ═══════════════════════════════════════════════════════════════
function buildReportText(result) {
  const FONT = "'Helvetica Neue', Helvetica, Arial, sans-serif";
  const { navy, teal, berry, ink, body, muted, panel, line, paper } = BRAND;

  const para    = t => `<p style="margin:0 0 15px;font-family:${FONT};font-size:16px;line-height:1.7;color:${body};">${t}</p>`;
  const eyebrow = t => `<p style="margin:0 0 14px;font-family:${FONT};font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:${teal};">${t}</p>`;
  const bullets = items => `<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 16px;">`
    + items.map(b =>
        `<tr>`
        + `<td valign="top" width="18" style="padding:0 0 9px;font-family:${FONT};font-size:16px;line-height:1.6;color:${teal};">&bull;</td>`
        + `<td valign="top" style="padding:0 0 9px;font-family:${FONT};font-size:16px;line-height:1.6;color:${body};">${b}</td>`
        + `</tr>`).join('')
    + `</table>`;
  const rule = `<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:26px 0;">`
    + `<tr><td style="height:1px;line-height:1px;font-size:0;background:${line};">&nbsp;</td></tr></table>`;

  // Content column, assembled first, then wrapped in the branded shell.
  const col = [];

  // ── Segment One — headline + immediate result ──
  col.push(`<h1 style="margin:0 0 20px;font-family:${FONT};font-size:25px;line-height:1.3;font-weight:bold;color:${ink};">${result.heading}</h1>`);
  result.summary.forEach(s => col.push(para(s)));

  col.push(rule);

  // ── Segment Two — framing ──
  result.introParas.forEach(s => col.push(para(s)));
  if (result.introBullets.length) col.push(bullets(result.introBullets));

  // ── Next steps — numbered, each in its own row ──
  col.push(`<h2 style="margin:24px 0 16px;font-family:${FONT};font-size:22px;line-height:1.3;font-weight:bold;color:${ink};">What To Do Now</h2>`);
  col.push(`<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">`
    + result.nextSteps.map((step, i) =>
        `<tr>`
        + `<td valign="top" width="34" style="padding:0 12px 20px 0;">`
          + `<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>`
          + `<td align="center" width="28" height="28" style="background:${teal};border-radius:14px;`
          + `font-family:${FONT};font-size:13px;font-weight:bold;color:#ffffff;line-height:28px;">${i + 1}</td>`
          + `</tr></table>`
        + `</td>`
        + `<td valign="top" style="padding:0 0 20px;">`
          + `<p style="margin:0 0 5px;font-family:${FONT};font-size:16px;line-height:1.45;font-weight:bold;color:${ink};">${step.title}</p>`
          + `<p style="margin:0;font-family:${FONT};font-size:16px;line-height:1.7;color:${body};">${step.body}</p>`
        + `</td></tr>`).join('')
    + `</table>`);

  // ── What this means for you — set apart in a tinted panel ──
  col.push(`<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:14px 0 0;">`
    + `<tr><td style="background:${panel};padding:24px 26px;">`
    + eyebrow('What this means for you')
    + result.whatThisMeans.map(s =>
        `<p style="margin:0 0 13px;font-family:${FONT};font-size:16px;line-height:1.7;color:${body};">${s}</p>`).join('')
    + `</td></tr></table>`);

  // ── Closing offer — the one place the berry accent is spent ──
  const url = (/scholar prep/i.test(result.offer.heading)
    ? OFFER_URLS.scholarPrep
    : OFFER_URLS.scholarsGetDollars) || SITE_URL;

  col.push(`<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:28px 0 0;">`
    + `<tr><td style="background:${navy};padding:28px 26px;">`
      + `<p style="margin:0 0 10px;font-family:${FONT};font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:#8FBFCB;">Your recommended next step</p>`
      + `<p style="margin:0 0 14px;font-family:${FONT};font-size:20px;line-height:1.35;font-weight:bold;color:#ffffff;">${result.offer.heading.replace(/^Your recommended next step:\s*/i, '')}</p>`
      + result.offer.paragraphs.map(t =>
          `<p style="margin:0 0 13px;font-family:${FONT};font-size:15px;line-height:1.65;color:#D6E4EA;">${t}</p>`).join('')
      + (result.offer.bullets.length
          ? `<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 16px;">`
            + result.offer.bullets.map(b =>
                `<tr>`
                + `<td valign="top" width="18" style="padding:0 0 8px;font-family:${FONT};font-size:15px;line-height:1.6;color:#8FBFCB;">&bull;</td>`
                + `<td valign="top" style="padding:0 0 8px;font-family:${FONT};font-size:15px;line-height:1.6;color:#D6E4EA;">${b}</td>`
                + `</tr>`).join('')
            + `</table>`
          : '')
      + `<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:6px;">`
        + `<tr><td align="center" style="background:${berry};border-radius:4px;">`
        + `<a href="${url}" style="display:inline-block;padding:15px 30px;font-family:${FONT};font-size:13px;`
        + `font-weight:bold;letter-spacing:1.2px;text-transform:uppercase;color:#ffffff;text-decoration:none;">`
        + `${result.offer.cta}</a></td></tr></table>`
    + `</td></tr></table>`);

  // ── Branded shell: logo header, navy score band, content, footer ──
  return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:${panel};">`
    + `<tr><td align="center" style="padding:0;">`
    + `<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:640px;background:${paper};">`

      // Logo — needs a light backdrop, the wordmark is dark navy
      + `<tr><td align="center" style="background:${paper};padding:30px 24px 24px;">`
        + `<img src="${LOGO_URL}" alt="Capture Greatness" width="210" `
        + `style="display:block;width:210px;max-width:60%;height:auto;border:0;" />`
      + `</td></tr>`

      // Score band — the hero
      + `<tr><td style="background:${navy};padding:24px 28px;">`
        + `<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr>`
        + `<td valign="middle" style="font-family:${FONT};">`
          + `<span style="font-size:40px;font-weight:bold;color:#ffffff;line-height:1;">${totalScore}</span>`
          + `<span style="font-size:16px;color:#8FBFCB;"> / 60</span>`
        + `</td>`
        + `<td valign="middle" align="right" style="font-family:${FONT};">`
          + `<p style="margin:0 0 3px;font-size:15px;font-weight:bold;color:#ffffff;line-height:1.35;">${result.label}</p>`
          + `<p style="margin:0;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#8FBFCB;">${GRADE_LABELS[grade] || grade}</p>`
        + `</td>`
        + `</tr></table>`
      + `</td></tr>`

      // Accent hairline under the band
      + `<tr><td style="height:3px;line-height:3px;font-size:0;background:${teal};">&nbsp;</td></tr>`

      // Body
      + `<tr><td style="padding:32px 28px 34px;">${col.join('\n')}</td></tr>`

      // Footer
      + `<tr><td style="background:${panel};padding:20px 28px;border-top:1px solid ${line};">`
        + `<p style="margin:0;font-family:${FONT};font-size:12px;line-height:1.6;color:${muted};">`
        + `Capture Greatness &middot; Scholarship &amp; College Coaching<br />`
        + `You're receiving this because you completed the Scholarship Readiness Assessment.</p>`
      + `</td></tr>`

    + `</table></td></tr></table>`;
}

// ═══════════════════════════════════════════════════════════════
//  Deliver report — identity came from the URL via the opt-in
//  landing page, so it is expected to already be present here
// ═══════════════════════════════════════════════════════════════
async function deliverReport(result) {
  const noticeEl = document.getElementById('email-notice');

  noticeEl.textContent = "Check your email for your recommended next steps.";

  if (!db) {
    console.error('No Supabase client — submission skipped. See config.js note above.');
    return;
  }

  const { error } = await db.from('quiz_submissions').insert({
    name:            contactName,
    email:           contactEmail,
    grade,
    total_score:     totalScore,
    result_category: getTier(totalScore),
    result_label:    result.label,
    report_subject:  result.emailSubject,
    report_text:     buildReportText(result),
    q13_answer:      allAnswers['q13'] ?? null,
    answers:         allAnswers
  });

  if (error) {
    console.error('Supabase error:', error);
  }
}
</script>
